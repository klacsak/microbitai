<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit AI</title>
    <!-- TensorFlow.js és TM Image & Speech könyvtárak -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
    <style>
:root{--bg:#070b1a;--card:rgba(13,18,38,.78);--panel:rgba(20,27,53,.72);--line:rgba(124,92,255,.25);--text:#f5f7ff;--muted:#9da7c7;--cyan:#35e7ff;--purple:#8b5cf6;--pink:#ff4ecd;--green:#2ee6a6;--red:#ff5b72;--radius:22px;--shadow:0 24px 70px rgba(0,0,0,.42)}*{box-sizing:border-box;transition:all .2s ease}body{font-family:Inter,'Segoe UI',system-ui,sans-serif;margin:0;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(53,231,255,.13),transparent 30%),radial-gradient(circle at 90% 85%,rgba(255,78,205,.14),transparent 32%),linear-gradient(135deg,#050816,#0a1025 55%,#12091d);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}.container{position:relative;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);max-width:520px;width:100%;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:30px;box-shadow:var(--shadow),0 0 0 1px rgba(139,92,246,.08);text-align:center;overflow:hidden}.container:before{content:"";position:absolute;top:-100px;left:50%;width:260px;height:160px;transform:translateX(-50%);background:var(--cyan);filter:blur(90px);opacity:.16;pointer-events:none}h1{position:relative;font-size:28px;font-weight:900;margin:0 0 20px;letter-spacing:-1px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(53,231,255,.16)}.section-box{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);border-radius:var(--radius);padding:15px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.button-group{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;font-size:13px;font-weight:800;border:0;border-radius:13px;cursor:pointer;outline:none}button:active{transform:scale(.96)}button:disabled{background:#252b42!important;color:#626b87!important;cursor:not-allowed;box-shadow:none!important;transform:none!important}.btn-primary,.btn-ai{background:linear-gradient(135deg,var(--cyan),#287cff 52%,var(--purple));color:#fff;box-shadow:0 8px 24px rgba(53,231,255,.18),0 0 18px rgba(139,92,246,.15)}.btn-primary:hover:not(:disabled),.btn-ai:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 28px rgba(53,231,255,.24)}.btn-disconnect{background:rgba(255,91,114,.08);color:#ff7c91;border:1px solid rgba(255,91,114,.3)}.btn-disconnect:hover:not(:disabled){background:rgba(255,91,114,.16);transform:translateY(-2px)}.btn-ai{width:100%;margin-top:8px;padding:12px;font-size:14px}.camera-side-controls{display:flex;flex-direction:column;gap:10px;justify-content:center}.btn-icon-round{width:42px;height:42px;padding:0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--cyan);border:1px solid rgba(53,231,255,.2);box-shadow:0 8px 20px rgba(0,0,0,.2)}.btn-icon-round:hover:not(:disabled){background:rgba(53,231,255,.12);border-color:var(--cyan);transform:translateY(-2px) scale(1.04);box-shadow:0 0 22px rgba(53,231,255,.18)}.svg-icon{width:19px;height:19px;fill:currentColor;display:inline-block;vertical-align:middle;flex-shrink:0}.bt-icon{width:15px;height:15px;fill:currentColor}.status-badge{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid rgba(255,255,255,.1)}.status-dot{width:8px;height:8px;border-radius:50%;background:#66708c}.status-badge.connected{background:rgba(46,230,166,.08);color:var(--green);border-color:rgba(46,230,166,.28)}.status-badge.connected .status-dot{background:var(--green);box-shadow:0 0 0 3px rgba(46,230,166,.12),0 0 14px var(--green);animation:pulse-dot 1.8s infinite}.status-badge.disconnected{background:rgba(255,91,114,.07);color:#ff8295;border-color:rgba(255,91,114,.25)}.status-badge.disconnected .status-dot{background:var(--red);box-shadow:0 0 10px rgba(255,91,114,.6)}@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.18)}}input[type=text],select{width:100%;padding:11px 13px;font-size:13px;border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(5,8,22,.65);color:var(--text);outline:none;margin-bottom:8px}select option{background:#10162d;color:#fff}input[type=text]::placeholder{color:#68728f}input[type=text]:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,231,255,.1),0 0 20px rgba(53,231,255,.08)}.slider-container{margin:8px 0 2px;text-align:left;font-size:11px;font-weight:800;color:var(--muted)}.slider-header{display:flex;justify-content:space-between;margin-bottom:6px}.slider-header strong{color:var(--cyan)}.slider-row{display:flex;align-items:center;gap:8px}input[type=range]{flex-grow:1;height:6px;border-radius:5px;background:#29314d;accent-color:var(--cyan);outline:none;cursor:pointer}#camera-layout{display:none;align-items:center;justify-content:center;gap:13px;margin:14px auto 8px}#camera-wrapper{position:relative;max-width:100%;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(53,231,255,.22),0 15px 45px rgba(0,0,0,.45),0 0 35px rgba(53,231,255,.08);line-height:0}#webcam-container canvas{display:block;width:210px;height:210px;object-fit:cover}#fullscreen-hud{display:none;position:absolute;top:15px;left:15px;right:15px;justify-content:space-between;align-items:center;z-index:9999;pointer-events:none}#fullscreen-detected{background:rgba(7,11,26,.82);backdrop-filter:blur(12px);color:var(--cyan);padding:7px 13px;border-radius:12px;font-size:14px;font-weight:900;border:1px solid rgba(53,231,255,.25);box-shadow:0 0 22px rgba(53,231,255,.12)}.fs-action-btn{pointer-events:auto;background:rgba(7,11,26,.78);backdrop-filter:blur(12px);color:#fff;border:1px solid rgba(255,255,255,.18);width:42px;height:42px;padding:0;border-radius:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.fs-action-btn:hover{color:var(--cyan);border-color:rgba(53,231,255,.45)}#camera-wrapper:fullscreen,#camera-wrapper:-webkit-full-screen{width:100vw!important;height:100vh!important;display:flex;align-items:center;justify-content:center;border-radius:0}#camera-wrapper:fullscreen canvas,#camera-wrapper:-webkit-full-screen canvas{width:auto!important;height:100vh!important;max-width:100vw!important;object-fit:contain}#camera-wrapper:fullscreen #fullscreen-hud,#camera-wrapper:-webkit-full-screen #fullscreen-hud{display:flex}#prediction-result{font-size:15px;font-weight:900;color:#fff;margin:14px 0 10px;min-height:22px;text-shadow:0 0 18px rgba(53,231,255,.18)}.label-bar-container{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:7px}.label-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:8px 11px;position:relative;overflow:hidden}.label-info{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#edf1ff;position:relative;z-index:2}.label-progress{position:absolute;top:0;left:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(53,231,255,.12),rgba(139,92,246,.3),rgba(255,78,205,.22));border-radius:13px;z-index:1;transition:width .15s ease-out}.label-card.active{border-color:rgba(53,231,255,.75);box-shadow:0 0 0 2px rgba(53,231,255,.08),0 0 24px rgba(53,231,255,.1)}.label-card.active .label-progress{background:linear-gradient(90deg,rgba(53,231,255,.32),rgba(139,92,246,.48),rgba(255,78,205,.32))}@media(max-width:520px){body{padding:12px}.container{padding:18px;border-radius:24px}h1{font-size:25px}#webcam-container canvas{width:190px;height:190px}.section-box{padding:13px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
    </style>
</head>
<body>

    <div class="container">
        <h1>Micro:bit AI</h1>
        
        <!-- 1. Bluetooth panel -->
        <div class="section-box">
            <div class="button-group">
                <button id="connectBtn" class="btn-primary" onclick="connectBluetooth()">
                    <svg class="bt-icon" viewBox="0 0 24 24">
                        <path d="M14.5 12l4.5-4.5-6-6v8.2L8.7 5.4 7.3 6.8 12 11.5v1l-4.7 4.7 1.4 1.4 4.3-4.3V22.5l6-6-4.5-4.5zm-0.5-6.8l2.7 2.7-2.7 2.7V5.2zm2.7 13.6L14 16.1v5.4l2.7-2.7z"/>
                    </svg>
                    Kapcsolódás
                </button>
                <button id="disconnectBtn" class="btn-disconnect" onclick="disconnectBluetooth()" disabled>
                    Kapcsolat bontása
                </button>
            </div>
            <div>
                <div id="status" class="status-badge disconnected">
                    <span class="status-dot"></span>
                    <span id="statusText">Nincs kapcsolat</span>
                </div>
            </div>
        </div>

        <!-- 2. AI Konfigurációs panel -->
        <div class="section-box">
            <select id="modelType" onchange="onModelTypeChange()">
                <option value="image">📷 Képi modell (Kamera)</option>
                <option value="audio">🎙️ Hang modell (Mikrofon)</option>
            </select>
            
            <input type="text" id="modelUrl" placeholder="https://teachablemachine.withgoogle.com/models/...">

            <!-- Küszöb szabályzó -->
            <div class="slider-container">
                <div class="slider-header">
                    <span>Döntési küszöb:</span>
                    <strong id="thresholdVal">85%</strong>
                </div>
                <div class="slider-row">
                    <span style="font-size: 10px;">50%</span>
                    <input type="range" id="thresholdSlider" min="50" max="100" value="85" oninput="updateThreshold(this.value)">
                    <span style="font-size: 10px;">100 %</span>
                </div>
            </div>

            <button id="startAiBtn" class="btn-ai" onclick="initAI()">
                Modell indítása
            </button>
        </div>

        <!-- Kamerakép ÉS közvetlenül mellette a két ikon -->
        <div id="camera-layout">
            <div id="camera-wrapper">
                <div id="fullscreen-hud">
                    <div id="fullscreen-detected">Osztály: -</div>
                    <div style="display: flex; gap: 8px;">
                        <button class="fs-action-btn" onclick="switchCamera()" title="Kamera váltása">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3 1.31 0 2.42-.83 2.83-2H13v-2h4.85c.08.32.15.65.15 1 0 2.76-2.24 5-5 5zm3-8.83C14.42 8.33 13.31 9 12 9c-1.66 0-3 1.34-3 3H7c0-2.76 2.24-5 5-5h1.17V5.5L16 7.67l-2.83 2.17V8.17z"/>
                            </svg>
                        </button>
                        <button class="fs-action-btn" onclick="toggleFullscreen()" title="Kilépés">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="webcam-container"></div>
            </div>

            <!-- Oldalsó ikonok a kamera mellett -->
            <div class="camera-side-controls">
                <button id="switchCameraBtn" class="btn-icon-round" onclick="switchCamera()" title="Kamera váltása" aria-label="Kamera váltása">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3 1.31 0 2.42-.83 2.83-2H13v-2h4.85c.08.32.15.65.15 1 0 2.76-2.24 5-5 5zm3-8.83C14.42 8.33 13.31 9 12 9c-1.66 0-3 1.34-3 3H7c0-2.76 2.24-5 5-5h1.17V5.5L16 7.67l-2.83 2.17V8.17z"/>
                    </svg>
                </button>

                <button id="fullscreenBtn" class="btn-icon-round" onclick="toggleFullscreen()" title="Teljes képernyő" aria-label="Teljes képernyő">
                    <svg class="svg-icon" id="fs-btn-icon" viewBox="0 0 24 24">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Eredmények és élő sávok -->
        <div id="prediction-result">Indítsd el a modellt!</div>
        <div id="label-container" class="label-bar-container"></div>
    </div>

    <script>
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let bleDevice = null;
        let rxCharacteristic = null;
        let model = null;
        let webcam = null;
        let recognizer = null;
        let labelContainer = null;
        let maxPredictions = 0;
        let isPredicting = false;
        let lastSentClass = "";
        let currentFacingMode = 'user';
        let confidenceThreshold = 0.85;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusBadge = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const predictionResult = document.getElementById('prediction-result');
        const startAiBtn = document.getElementById('startAiBtn');
        const cameraLayout = document.getElementById('camera-layout');
        const cameraWrapper = document.getElementById('camera-wrapper');
        const fullscreenDetected = document.getElementById('fullscreen-detected');
        const thresholdVal = document.getElementById('thresholdVal');
        const fsBtnIcon = document.getElementById('fs-btn-icon');

        function updateThreshold(val) {
            confidenceThreshold = val / 100;
            thresholdVal.innerText = val + "%";
        }

        function onModelTypeChange() {
            stopCurrentAI();
            cameraLayout.style.display = "none";
            predictionResult.innerText = "Modell típus módosítva.";
        }

        async function connectBluetooth() {
            try {
                statusText.innerText = "Keresés...";
                statusBadge.className = "status-badge";

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusText.innerText = "Csatlakozás...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                statusText.innerText = "Csatlakoztatva";
                statusBadge.className = "status-badge connected";
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } catch (error) {
                console.error("Bluetooth hiba: ", error);
                statusText.innerText = "Sikertelen";
                statusBadge.className = "status-badge disconnected";
            }
        }

        function disconnectBluetooth() {
            if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
        }

        function onDisconnected() {
            statusText.innerText = "Nincs kapcsolat";
            statusBadge.className = "status-badge disconnected";
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            rxCharacteristic = null;
            lastSentClass = "";
        }

        async function sendToMicrobit(className) {
            if (!rxCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(className + "\n");
                if (rxCharacteristic.writeValueWithoutResponse) {
                    await rxCharacteristic.writeValueWithoutResponse(data);
                } else {
                    await rxCharacteristic.writeValue(data);
                }
                console.log("micro:bit-nek elküldve:", className);
            } catch (err) {
                console.error("Küldési hiba:", err);
            }
        }

        function stopCurrentAI() {
            isPredicting = false;
            if (webcam) {
                try {
                    if (webcam.webcam && webcam.webcam.srcObject) {
                        webcam.webcam.srcObject.getTracks().forEach(t => t.stop());
                    }
                    webcam.stop();
                } catch(e){}
                webcam = null;
            }
            if (recognizer) {
                try { recognizer.stopListening(); } catch(e){}
                recognizer = null;
            }
            startAiBtn.disabled = false;
        }

        async function initAI() {
            let url = document.getElementById('modelUrl').value.trim();
            if (!url) {
                alert("Kérlek add meg a Teachable Machine modell linkjét!");
                return;
            }
            if (!url.endsWith('/')) url += '/';

            stopCurrentAI();
            startAiBtn.disabled = true;
            predictionResult.innerText = "Betöltés...";

            const modelType = document.getElementById('modelType').value;

            try {
                if (modelType === 'image') {
                    await initImageModel(url);
                } else {
                    await initAudioModel(url);
                }
            } catch (err) {
                console.error("AI Betöltési Hiba: ", err);
                alert("Hiba a betöltéskor! Ellenőrizd a linket és a jogosultságokat.");
                startAiBtn.disabled = false;
                predictionResult.innerText = "Betöltési hiba.";
            }
        }

        async function initImageModel(url) {
            const modelURL = url + "model.json";
            const metadataURL = url + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            currentFacingMode = 'user';
            await setupWebcam(currentFacingMode);

            isPredicting = true;
            window.requestAnimationFrame(imageLoop);

            setupLabelBars(model.getClassLabels());
            cameraLayout.style.display = "flex";
            predictionResult.innerText = "Felismerés...";
        }

        async function setupWebcam(facingMode) {
            const flip = (facingMode === 'user');
            webcam = new tmImage.Webcam(224, 224, flip);
            await webcam.setup({ facingMode: facingMode });
            await webcam.play();
            const container = document.getElementById("webcam-container");
            container.innerHTML = "";
            container.appendChild(webcam.canvas);
        }

        async function imageLoop() {
            if (isPredicting && webcam) {
                webcam.update();
                await predictImage();
                window.requestAnimationFrame(imageLoop);
            }
        }

        async function predictImage() {
            const prediction = await model.predict(webcam.canvas);
            evaluatePredictions(prediction);
        }

        async function switchCamera() {
            if (!webcam) return;
            const btn = document.getElementById('switchCameraBtn');
            btn.disabled = true;
            isPredicting = false;
            try {
                if (webcam.webcam && webcam.webcam.srcObject) {
                    webcam.webcam.srcObject.getTracks().forEach(t => t.stop());
                }
                webcam.stop();
                currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
                await setupWebcam(currentFacingMode);
                isPredicting = true;
                window.requestAnimationFrame(imageLoop);
            } catch(e) {
                alert("Nem sikerült kamerát váltani.");
            } finally {
                btn.disabled = false;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (cameraWrapper.requestFullscreen) cameraWrapper.requestFullscreen();
                else if (cameraWrapper.webkitRequestFullscreen) cameraWrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', updateFsIcon);
        document.addEventListener('webkitfullscreenchange', updateFsIcon);

        function updateFsIcon() {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFs) {
                fsBtnIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
                document.getElementById('fullscreenBtn').setAttribute('title', 'Kilépés');
            } else {
                fsBtnIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
                document.getElementById('fullscreenBtn').setAttribute('title', 'Teljes képernyő');
            }
        }

        async function initAudioModel(url) {
            const checkpointURL = url + "model.json";
            const metadataURL = url + "metadata.json";

            recognizer = speechCommands.create(
                "BROWSER_FFT",
                undefined,
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            const words = recognizer.wordLabels();
            maxPredictions = words.length;

            setupLabelBars(words);
            cameraLayout.style.display = "none";
            predictionResult.innerText = "Mikrofon aktív...";

            recognizer.listen(result => {
                const predictions = [];
                for (let i = 0; i < words.length; i++) {
                    predictions.push({
                        className: words[i],
                        probability: result.scores[i]
                    });
                }
                evaluatePredictions(predictions);
            }, {
                includeSpectrogram: false,
                probabilityThreshold: 0.50,
                overlapFactor: 0.50
            });
        }

        function setupLabelBars(labels) {
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < labels.length; i++) {
                const card = document.createElement("div");
                card.className = "label-card";
                card.id = `label-card-${i}`;

                const progress = document.createElement("div");
                progress.className = "label-progress";
                progress.id = `label-progress-${i}`;

                const info = document.createElement("div");
                info.className = "label-info";
                info.innerHTML = `<span>${labels[i]}</span><span id="label-val-${i}">0%</span>`;

                card.appendChild(progress);
                card.appendChild(info);
                labelContainer.appendChild(card);
            }
        }

        let lastSendTime = 0; // Időzítő a Bluetooth fojtásához (ne fagyjon le a micro:bit)

        function evaluatePredictions(predictions) {
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < predictions.length; i++) {
                const name = predictions[i].className;
                const prob = predictions[i].probability;
                const percent = Math.round(prob * 100);

                const valElem = document.getElementById(`label-val-${i}`);
                const progElem = document.getElementById(`label-progress-${i}`);
                const cardElem = document.getElementById(`label-card-${i}`);

                if (valElem && progElem) {
                    valElem.innerText = percent + "%";
                    progElem.style.width = percent + "%";
                }

                if (name.toLowerCase() !== "background noise") {
                    if (prob > highestProb) {
                        highestProb = prob;
                        bestClass = name;
                    }
                }

                if (cardElem) {
                    if (prob >= confidenceThreshold && name.toLowerCase() !== "background noise") {
                        cardElem.classList.add('active');
                    } else {
                        cardElem.classList.remove('active');
                    }
                }
            }

            // Döntési küszöb elérése
            if (highestProb >= confidenceThreshold) {
                const szazalek = Math.round(highestProb * 100);
                const text = `Észlelve: ${bestClass} (${szazalek}%)`;
                predictionResult.innerText = text;
                fullscreenDetected.innerText = text;

                const now = Date.now();
                // Küldés: ha megváltozott az osztály, VAGY ha ugyanaz maradt, de eltelt legalább 1200 ms (hogy legyen ideje kiírni)
                if (bestClass !== lastSentClass || (now - lastSendTime > 1200)) {
                    lastSentClass = bestClass;
                    lastSendTime = now;
                    sendToMicrobit(bestClass + ":" + szazalek);
                }
            }
        }
    </script>
</body>
</html>
